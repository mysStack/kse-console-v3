name: Build V3 Console

on:
  push:
    branches:
      - main
      - release-4.1.5
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - release-4.1.5
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 使用 Node.js 14
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: 安装依赖
        run: yarn install --frozen-lockfile

      - name: 构建 V3 静态资源
        env:
          V3_PUBLIC_PATH: /dist/v3dist/
        run: yarn build:client

      - name: 写入制品元数据
        env:
          V3_REF: ${{ github.ref_name }}
          V3_SHA: ${{ github.sha }}
        run: |
          cat > dist/.v3dist-source.json <<EOF
          {"schemaVersion":1,"repository":"mysStack/kse-console-v3","ref":"${V3_REF}","commit":"${V3_SHA}"}
          EOF

      - name: 打包 V3 制品
        env:
          V3_REF: ${{ github.ref_name }}
        run: |
          safe_ref="${V3_REF//\//-}"
          tar -czf "console-v3dist-${safe_ref}.tar.gz" -C dist .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: console-v3dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: 发布版本制品
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: console-v3dist-${{ github.ref_name }}.tar.gz
